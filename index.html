  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0a;
      --surface: #141414;
      --border:  #242424;
      --text:    #f0f0f0;
      --muted:   #777;
      --g-blue:  #4285f4;
      --g-red:   #ea4335;
      --g-yel:   #fbbc04;
      --g-grn:   #34a853;
      --radius:  18px;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;

    #app { width: 100%; max-width: 380px; text-align: center; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .spinner-wrap { padding: 40px 0; }
    .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--g-blue); border-radius: 50%; animation: spin .75s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { color: var(--muted); font-size: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 22px; }
    .g-word { display: inline-flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 700; letter-spacing: .3px; margin-bottom: 20px; opacity: .85; }
    .g-word .g  { color: var(--g-blue); } .g-word .o1 { color: var(--g-red); } .g-word .o2 { color: var(--g-yel); } .g-word .gl { color: var(--g-blue); } .g-word .e  { color: var(--g-grn); } .g-word .r  { color: var(--g-red); }
    .icon { font-size: 40px; margin-bottom: 14px; line-height: 1; }
    h1 { font-size: 19px; font-weight: 600; line-height: 1.3; letter-spacing: -.2px; margin-bottom: 8px; }
    .business { color: var(--g-blue); }
    .sub { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin-bottom: 22px; }
    .steps { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 18px; text-align: left; }
    .step { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .step + .step { margin-top: 11px; }
    .step-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--g-blue); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .step em { color: var(--text); font-style: normal; font-weight: 500; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 13px 18px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: opacity .15s, transform .1s; -webkit-tap-highlight-color: transparent; line-height: 1; }
    .btn:active { opacity: .82; transform: scale(.97); }
    .btn-primary { background: var(--g-blue); color: #fff; margin-bottom: 10px; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .url-row { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; margin-top: 12px; }
    .url-text { flex: 1; font-size: 11px; color: var(--muted); word-break: break-all; text-align: left; line-height: 1.35; }
    .copy-btn { flex-shrink: 0; background: var(--border); border: none; color: var(--text); font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 7px; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .copy-btn.copied { background: var(--g-grn); color: #fff; }
    .hint { color: var(--muted); font-size: 12.5px; margin-top: 14px; line-height: 1.5; }
    .hint code { font-family: monospace; background: var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

// ════════════════════════════════════════════════════════════════

function getSlug() { return window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase() || null; }
function detectOS() { const u = navigator.userAgent; if (/iPad|iPhone|iPod/.test(u) && !window.MSStream) return 'ios'; if (/android/i.test(u)) return 'android'; return 'other'; }
function detectInApp() { const u = navigator.userAgent; return /FBAN|FBAV|FBIOS|FB_IAB|FBBV|Instagram|MicroMessenger|BytedanceWebview|musical_ly|Snapchat|LinkedInApp|Twitter/.test(u); }
function bustCache(url) { const b = `_t=${Date.now()}`; const h = url.indexOf('#'); if (h === -1) return `${url}${url.includes('?') ? '&' : '?'}${b}`; return `${url.slice(0,h)}${url.slice(0,h).includes('?') ? '&' : '?'}${b}${url.slice(h)}`; }
function buildIntent(url) { const s = url.replace(/^https?:\/\//, ''); return `intent://${s}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end`; }
function buildChrome(url) { return url.replace(/^https:\/\//, 'googlechromes://').replace(/^http:\/\//, 'googlechrome://'); }
async function copy(text) { try { await navigator.clipboard.writeText(text); return true; } catch { const t = Object.assign(document.createElement('textarea'), { value: text, style: 'position:fixed;opacity:0' }); document.body.appendChild(t); t.focus(); t.select(); const ok = document.execCommand('copy'); document.body.removeChild(t); return ok; } }
function gWord() { return `<div class="g-word"><span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="gl">g</span><span class="e">l</span><span class="r">e</span>&nbsp;Recenze</div>`; }
function urlRow(url) { return `<div class="url-row"><span class="url-text">${url}</span><button class="copy-btn" id="copyBtn">Kopírovat</button></div>`; }
function attachCopy(url) { const b = document.getElementById('copyBtn'); if (!b) return; b.addEventListener('click', async () => { const ok = await copy(url); b.textContent = ok ? '✓ OK' : 'Chyba'; b.classList.toggle('copied', ok); setTimeout(() => { b.textContent = 'Kopírovat'; b.classList.remove('copied'); }, 2500); }); }

function renderNotFound(slug) {
  document.title = '404 – Recenzemat'; 
  document.getElementById('app').innerHTML = `<div class="card"><div class="icon">🔍</div><h1>Odkaz neexistuje</h1><p class="sub">Slot <strong>/${slug || ''}</strong> nemá vyplněnou URL.</p><p class="hint">Otevři <code>index.html</code> a doplň <code>url:</code> pro tento stojánek.</p></div>`;
}

function renderIOS(name, url) {
  document.getElementById('app').innerHTML = `<div class="card">${gWord()}<div class="icon">⭐</div><h1>Ohodnoť <span class="business">${name}</span></h1><p class="sub">Jsi v in-app prohlížeči. Otevři odkaz v Safari nebo Chrome, kde jsi přihlášen/á ke Google.</p><div class="steps"><div class="step"><div class="step-dot">1</div><div>Zkus tlačítko níže — otevře <em>Chrome</em></div></div><div class="step"><div class="step-dot">2</div><div>Pokud se nic nestane, klikni na <em>⋯</em> v rohu a vyber <em>Otevřít v prohlížeči</em></div></div><div class="step"><div class="step-dot">3</div><div>Nebo zkopíruj odkaz a vlož do Safari / Chrome</div></div></div><button class="btn btn-primary" id="chromeBtn">🌐 Otevřít v Chrome</button>${urlRow(url)}</div>`;
  document.getElementById('chromeBtn').addEventListener('click', () => { window.location.href = buildChrome(url); setTimeout(() => { window.location.href = url; }, 900); });
  attachCopy(url);
}

function renderAndroid(name, url) {
  const intent = buildIntent(url);
  document.getElementById('app').innerHTML = `<div class="card">${gWord()}<div class="icon">⭐</div><h1>Ohodnoť <span class="business">${name}</span></h1><p class="sub">Otevíráme Chrome, kde jsi přihlášen/á ke Google účtu…</p><button class="btn btn-primary" id="chromeBtn">🌐 Otevřít v Chrome</button><button class="btn btn-secondary" id="directBtn">Otevřít tady</button>${urlRow(url)}</div>`;
  setTimeout(() => { window.location.href = intent; }, 400);
  document.getElementById('chromeBtn').addEventListener('click', () => { window.location.href = intent; setTimeout(() => { window.location.href = url; }, 900); });
  document.getElementById('directBtn').addEventListener('click', () => { window.location.href = url; });
  attachCopy(url);
}

(function main() {
  const slug  = getSlug();
  const entry = slug ? REDIRECTS[slug] : null;
  if (!entry || !entry.url) { renderNotFound(slug); return; }
  const { name, url } = entry;
  const final = bustCache(url);
  document.title = `Recenze – ${name}`;
  if (!detectInApp()) { window.location.href = final; return; }
  detectOS() === 'android' ? renderAndroid(name, final) : renderIOS(name, final);
})();
